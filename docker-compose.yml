# Lotusette — exécution en conteneur (optionnelle).
#
# PostgreSQL et Redis ont été retirés : aucun code ne les utilise. La mémoire
# long terme tient dans un fichier SQLite, dans le volume lotusette-data.
# Ils reviendront si un déploiement multi-utilisateurs le justifie.
#
# Le modèle tourne sur l'hôte :
#   llama-server -hf <modèle> -c 8192 --port 8080 --host 0.0.0.0

services:
  lotusette:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lotusette
    volumes:
      # Code source monté pour le développement.
      - .:/app
      # Données persistantes (base SQLite, modèles, embeddings).
      - lotusette-data:/data
    ports:
      - "8000:8000"  # API, étape E7
    environment:
      PYTHONUNBUFFERED: "1"
      LOTUSETTE_DATA_DIR: /data
      # Joindre le serveur d'inférence qui tourne sur la machine hôte.
      LOCAL_LLM_BASE_URL: "http://host.docker.internal:8080/v1"
    extra_hosts:
      # Nécessaire sous Linux, où host.docker.internal n'existe pas par défaut.
      - "host.docker.internal:host-gateway"
    # Nécessaire pour l'interaction avec le CLI.
    stdin_open: true
    tty: true
    command: python -m lotusette.ui.cli

volumes:
  lotusette-data:
    driver: local
